<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d2c91">
<title>Yağız & Sinem ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
    color: white;
    font-family: 'Montserrat', sans-serif;
    background:
        radial-gradient(circle at 50% 35%, rgba(255, 92, 190, .25), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(105, 55, 180, .45), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(218, 60, 170, .25), transparent 35%),
        linear-gradient(145deg, #190b35 0%, #42145d 42%, #7c226f 72%, #c63891 100%);
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at center, transparent 25%, rgba(8, 3, 20, .38) 100%);
    z-index: 1;
}

/* =========================
   STARS
========================= */

.stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 2;
}

.star {
    position: absolute;
    bottom: -20px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 5px rgba(255,255,255,.9),
        0 0 10px rgba(255,180,245,.8);
    opacity: 0;
    animation: rise linear infinite;
}

.star::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: white;
    transform: scale(1.8);
    opacity: .45;
}

@keyframes rise {
    0% {
        transform: translateY(0) scale(.7);
        opacity: 0;
    }

    12% {
        opacity: .8;
    }

    70% {
        opacity: .65;
    }

    100% {
        transform: translateY(-115vh) scale(1.15);
        opacity: 0;
    }
}

/* =========================
   TOP LEFT
========================= */

.brand {
    position: fixed;
    top: 28px;
    left: 30px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 2.2vw, 30px);
    letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(255,255,255,.65);
}

.mini-heart {
    width: 25px;
    height: 25px;
    background: #ff4fa9;
    transform: rotate(-45deg);
    position: relative;
    animation: miniBeat 1.05s infinite ease-in-out;
    filter: drop-shadow(0 0 9px rgba(255,75,175,.9));
}

.mini-heart::before,
.mini-heart::after {
    content: "";
    position: absolute;
    width: 25px;
    height: 25px;
    background: inherit;
    border-radius: 50%;
}

.mini-heart::before {
    top: -12px;
    left: 0;
}

.mini-heart::after {
    top: 0;
    left: 12px;
}

@keyframes miniBeat {
    0%, 100% {
        transform: rotate(-45deg) scale(1);
    }

    15% {
        transform: rotate(-45deg) scale(1.18);
    }

    30% {
        transform: rotate(-45deg) scale(1);
    }

    45% {
        transform: rotate(-45deg) scale(1.12);
    }

    60% {
        transform: rotate(-45deg) scale(1);
    }
}

/* =========================
   MAIN
========================= */

main {
    position: relative;
    z-index: 5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 90px 20px 170px;
}

.content {
    width: min(1150px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================
   TEXT HEART
========================= */

.heart-wrapper {
    position: relative;
    width: min(82vw, 650px);
    height: min(72vw, 570px);
    min-height: 450px;

    display: flex;
    align-items: center;
    justify-content: center;

    animation: heartBeat 1.15s infinite cubic-bezier(.4,0,.2,1);
}

.heart-glow {
    position: absolute;
    width: 82%;
    height: 82%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,180,.34),
            rgba(255,70,180,.12) 35%,
            transparent 70%
        );

    filter: blur(42px);
    opacity: .85;
}

/* Kalbin tamamı yazılardan oluşuyor */

.heart-text {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

.word-cloud {
    position: absolute;
    inset: 0;

    display: grid;

    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(13, 1fr);

    align-items: center;
    justify-items: center;

    transform: none;
    padding: 15px;
}

/* Her kelime */

.word {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;

    color: rgba(255,255,255,.97);

    white-space: nowrap;

    text-shadow:
        0 0 6px rgba(255,255,255,1),
        0 0 14px rgba(255,150,230,.95),
        0 0 27px rgba(255,65,180,.75);

    transition:
        opacity .45s ease,
        transform .45s ease;

    z-index: 7;
}

/* =========================
   KALP DIŞ HATLARI
========================= */

/* Sol üst */

.word:nth-child(1) {
    grid-column: 3;
    grid-row: 3;
    font-size: 26px;
}

.word:nth-child(2) {
    grid-column: 4;
    grid-row: 2;
    font-size: 29px;
}

.word:nth-child(3) {
    grid-column: 5;
    grid-row: 2;
    font-size: 25px;
}

.word:nth-child(4) {
    grid-column: 6;
    grid-row: 3;
    font-size: 27px;
}

/* Sağ üst */

.word:nth-child(5) {
    grid-column: 10;
    grid-row: 3;
    font-size: 26px;
}

.word:nth-child(6) {
    grid-column: 11;
    grid-row: 2;
    font-size: 29px;
}

.word:nth-child(7) {
    grid-column: 12;
    grid-row: 2;
    font-size: 25px;
}

.word:nth-child(8) {
    grid-column: 13;
    grid-row: 3;
    font-size: 27px;
}

/* =========================
   İÇ YAZI DOLGUSU
========================= */

.word-cloud::before {
    content:
        "Yağız   Sinem   Aşkım   I Love You   "
        "Yağız   Sinem   Aşkım   I Love You   "
        "Sinem   Yağız   Aşkım   I Love You   "
        "Yağız   Sinem   Aşkım";

    position: absolute;

    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    width: 70%;
    height: 56%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;

    font-size: clamp(19px, 2.8vw, 28px);

    line-height: 1.65;
    letter-spacing: 3px;
    word-spacing: 7px;

    color: rgba(255,255,255,.95);

    text-shadow:
        0 0 5px white,
        0 0 13px #ff9ddd,
        0 0 28px #ff4eaa;

    z-index: 4;
}

/* =========================
   MERKEZ SINEM
========================= */

.center-name {
    position: absolute;

    left: 50%;
    top: 51%;

    transform: translate(-50%, -50%);

    z-index: 12;

    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(50px, 8vw, 82px);

    font-weight: 600;

    letter-spacing: 5px;

    color: white;

    text-shadow:
        0 0 8px white,
        0 0 20px #ff9ddd,
        0 0 40px #ff4eaa,
        0 0 70px #ff318f;

    transition: transform .12s ease;
}

/* =========================
   HEART PULSE
========================= */

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }

    10% {
        transform: scale(1.045);
    }

    20% {
        transform: scale(1);
    }

    32% {
        transform: scale(1.035);
    }

    44% {
        transform: scale(1);
    }
}

/* =========================
   DISTANCE BOX
========================= */

.distance-box {
    width: min(570px, 92vw);
    min-height: 135px;

    margin-top: 5px;

    padding: 25px 30px;

    border: 1px solid rgba(255,255,255,.22);
    border-radius: 22px;

    background: rgba(255,255,255,.075);

    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.12);

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;
    overflow: hidden;
}

.distance-box::before {
    content: "♡";

    position: absolute;

    font-size: 170px;

    right: -35px;
    bottom: -70px;

    color: rgba(255,255,255,.025);
}

.distance-text {
    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(19px, 3vw, 27px);

    line-height: 1.45;

    letter-spacing: .4px;

    text-shadow:
        0 0 12px rgba(255,255,255,.25);

    transition:
        opacity .5s ease,
        transform .5s ease;
}

.special {
    margin-top: 21px;

    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(24px, 4vw, 35px);

    letter-spacing: 2px;

    font-weight: 600;

    color: white;

    text-shadow:
        0 0 5px white,
        0 0 12px #fff,
        0 0 24px #ff9ee0,
        0 0 45px #ff55b4;

    animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        text-shadow:
            0 0 5px white,
            0 0 12px #fff,
            0 0 20px #ff9ee0;
    }

    to {
        text-shadow:
            0 0 7px white,
            0 0 18px white,
            0 0 30px #ff8ed7,
            0 0 50px #ff4db0;
    }
}

/* =========================
   ECG
========================= */

.ecg-container {
    position: fixed;
    z-index: 10;

    bottom: 24px;
    left: 50%;

    transform: translateX(-50%);

    width: min(700px, 86vw);
    height: 75px;

    pointer-events: none;
}

.ecg-label {
    position: absolute;

    left: 0;
    top: -22px;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: .55;
}

.ecg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.ecg-line {
    fill: none;

    stroke: rgba(255,255,255,.9);

    stroke-width: 2;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter:
        drop-shadow(0 0 5px rgba(255,120,210,.9));

    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;

    animation: ecgMove 2.2s linear infinite;
}

@keyframes ecgMove {
    to {
        stroke-dashoffset: 0;
    }
}

/* =========================
   MUSIC BUTTON
========================= */

.music-control {
    position: fixed;

    z-index: 30;

    right: 25px;
    top: 25px;

    width: 44px;
    height: 44px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.25);

    background: rgba(255,255,255,.09);

    backdrop-filter: blur(10px);

    color: white;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.2);

    transition: .3s ease;
}

.music-control:hover {
    transform: scale(1.08);

    background:
        rgba(255,255,255,.16);
}

/* =========================
   START SCREEN
========================= */

.start-screen {
    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            rgba(184,43,135,.3),
            transparent 40%
        ),
        #160725;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.start-screen.hidden {
    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}

.start-content {
    text-align: center;
    padding: 30px;
}

.start-heart {
    width: 70px;
    height: 70px;

    margin: 0 auto 35px;

    background: #f64ca7;

    transform: rotate(-45deg);

    position: relative;

    animation:
        miniBeat 1.1s infinite;

    filter:
        drop-shadow(0 0 25px #ff4ba9);
}

.start-heart::before,
.start-heart::after {
    content: "";

    position: absolute;

    width: 70px;
    height: 70px;

    background: inherit;

    border-radius: 50%;
}

.start-heart::before {
    top: -35px;
    left: 0;
}

.start-heart::after {
    top: 0;
    left: 35px;
}

.start-title {
    font-family: 'Cormorant Garamond', serif;

    font-size:
        clamp(35px, 8vw, 62px);

    margin-bottom: 10px;

    text-shadow:
        0 0 20px rgba(255,255,255,.7);
}

.start-subtitle {
    opacity: .7;

    font-size: 13px;

    margin-bottom: 30px;
}

.start-button {
    border:
        1px solid rgba(255,255,255,.35);

    border-radius: 50px;

    padding: 13px 28px;

    color: white;

    background:
        rgba(255,255,255,.08);

    font-family:
        'Montserrat', sans-serif;

    cursor: pointer;

    transition: .3s ease;

    backdrop-filter:
        blur(10px);
}

.start-button:hover {
    background:
        rgba(255,255,255,.17);

    transform:
        translateY(-2px);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .brand {
        top: 19px;
        left: 18px;

        font-size: 20px;
    }

    .mini-heart {
        width: 19px;
        height: 19px;
    }

    .mini-heart::before,
    .mini-heart::after {
        width: 19px;
        height: 19px;
    }

    .mini-heart::before {
        top: -9px;
    }

    .mini-heart::after {
        left: 9px;
    }

    .music-control {
        top: 16px;
        right: 16px;

        width: 40px;
        height: 40px;
    }

    main {
        padding-top: 95px;
        padding-bottom: 150px;
    }

    .heart-wrapper {
        width: 96vw;
        height: 82vw;

        min-height: 390px;

        max-width: 540px;
        max-height: 470px;
    }

    .word-cloud {
        grid-template-columns:
            repeat(15, 1fr);

        grid-template-rows:
            repeat(13, 1fr);

        padding: 4px;
    }

    .word:nth-child(1) {
        font-size: 17px;
    }

    .word:nth-child(2) {
        font-size: 20px;
    }

    .word:nth-child(3) {
        font-size: 17px;
    }

    .word:nth-child(4) {
        font-size: 19px;
    }

    .word:nth-child(5) {
        font-size: 17px;
    }

    .word:nth-child(6) {
        font-size: 20px;
    }

    .word:nth-child(7) {
        font-size: 17px;
    }

    .word:nth-child(8) {
        font-size: 19px;
    }

    .word-cloud::before {
        width: 82%;
        height: 58%;

        font-size: 16px;

        line-height: 1.65;

        letter-spacing: 1.5px;
        word-spacing: 3px;
    }

    .center-name {
        font-size: 45px;
        letter-spacing: 3px;
    }

    .distance-box {
        margin-top: 0;

        min-height: 125px;

        padding: 20px;
    }

    .special {
        margin-top: 17px;
    }

    .ecg-container {
        width: 91vw;

        bottom: 18px;

        height: 60px;
    }

    .ecg-label {
        top: -18px;
    }
}

/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 2s !important;
    }
}
</style>
</head>

<body>

<!-- =========================
     STARS
========================= -->

<div class="stars" id="stars"></div>

<!-- =========================
     TOP LEFT
========================= -->

<div class="brand">

    <div class="mini-heart"></div>

    <span>
        Yağız &amp; Sinem
    </span>

</div>

<!-- =========================
     MUSIC
========================= -->

<audio id="music" loop preload="auto">

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>

<button
    class="music-control"
    id="musicButton"
    aria-label="Müziği aç/kapat">

    ♫

</button>

<!-- =========================
     START SCREEN
========================= -->

<div
    class="start-screen"
    id="startScreen">

    <div class="start-content">

        <div class="start-heart"></div>

        <div class="start-title">
            Yağız &amp; Sinem
        </div>

        <div class="start-subtitle">
            Sana özel küçük bir dünya...
        </div>

        <button
            class="start-button"
            id="startButton">

            Kalbimize Gir ❤️

        </button>

    </div>

</div>

<!-- =========================
     MAIN
========================= -->

<main>

    <div class="content">

        <!-- =====================
             TEXT HEART
        ====================== -->

        <div class="heart-wrapper">

            <div class="heart-glow"></div>

            <div class="heart-text">

                <div
                    class="word-cloud"
                    id="wordCloud">

                    <span class="word">
                        Yağız
                    </span>

                    <span class="word">
                        Sinem
                    </span>

                    <span class="word">
                        Aşkım
                    </span>

                    <span class="word">
                        I Love You
                    </span>

                    <span class="word">
                        Yağız
                    </span>

                    <span class="word">
                        Sinem
                    </span>

                    <span class="word">
                        Aşkım
                    </span>

                    <span class="word">
                        I Love You
                    </span>

                </div>

                <div class="center-name">
                    Sinem
                </div>

            </div>

        </div>

        <!-- =====================
             DISTANCE MESSAGE
        ====================== -->

        <div class="distance-box">

            <div
                class="distance-text"
                id="distanceText">

                Mesafeler sadece aramızdaki yolu uzatır,
                kalplerimizin arasındaki yolu değil. ❤️

            </div>

        </div>

        <div class="special">
            Sadece Sinem'ime özel
        </div>

    </div>

</main>

<!-- =========================
     ECG
========================= -->

<div class="ecg-container">

    <div class="ecg-label">
        kalbim senin için atıyor
    </div>

    <svg
        class="ecg"
        viewBox="0 0 700 75"
        preserveAspectRatio="none">

        <path
            class="ecg-line"
            d="
            M0 38
            L90 38
            L105 38
            L118 38
            L128 20
            L138 57
            L150 7
            L165 38
            L250 38
            L265 38
            L278 38
            L288 20
            L298 57
            L310 7
            L325 38
            L410 38
            L425 38
            L438 38
            L448 20
            L458 57
            L470 7
            L485 38
            L570 38
            L585 38
            L598 38
            L608 20
            L618 57
            L630 7
            L645 38
            L700 38
            "
        />

    </svg>

</div>

<script>

/* =====================================================
   STAR GENERATOR
===================================================== */

const starsContainer =
    document.getElementById("stars");

for (let i = 0; i < 65; i++) {

    const star =
        document.createElement("span");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    const size =
        Math.random() * 2 + 1;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    star.style.animationDuration =
        (9 + Math.random() * 13) + "s";

    star.style.animationDelay =
        (-Math.random() * 20) + "s";

    starsContainer.appendChild(star);
}


/* =====================================================
   MUSIC
===================================================== */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

let musicPlaying = false;

function startMusic() {

    music.volume = 0.45;

    music.play()
        .then(() => {

            musicPlaying = true;

            musicButton.textContent = "♫";

        })
        .catch(() => {

            musicPlaying = false;

        });

}

startButton.addEventListener(
    "click",
    () => {

        startMusic();

        startScreen.classList.add("hidden");

    }
);

musicButton.addEventListener(
    "click",
    () => {

        if (musicPlaying) {

            music.pause();

            musicPlaying = false;

            musicButton.textContent = "🔇";

        } else {

            startMusic();

        }

    }
);


/* =====================================================
   HEART WORDS
===================================================== */

const words = [

    "Yağız",
    "Sinem",
    "Aşkım",
    "I Love You"

];

const wordElements =
    document.querySelectorAll(".word");

let wordIndex = 0;

function changeHeartWords() {

    wordElements.forEach(
        (word, index) => {

            word.style.opacity = "0";

            word.style.transform =
                "scale(.65) translateY(8px)";

            setTimeout(
                () => {

                    const randomWord =
                        words[
                            (wordIndex + index)
                            % words.length
                        ];

                    word.textContent =
                        randomWord;

                    word.style.opacity = "1";

                    word.style.transform =
                        "scale(1) translateY(0)";

                },
                400 + index * 55
            );

        }
    );

    wordIndex++;

}

setInterval(
    changeHeartWords,
    3600
);


/* =====================================================
   DISTANCE MESSAGES
===================================================== */

const distanceMessages = [

    "Mesafeler sadece aramızdaki yolu uzatır, kalplerimizin arasındaki yolu değil. ❤️",

    "Senden uzakta olabilirim ama kalbimin en güzel yeri hâlâ senin. ❤️",

    "Aynı gökyüzünün altında olmak bile bana seni hatırlatmaya yetiyor.",

    "Aramızda kilometreler olabilir, ama kalbimin attığı yer hep sensin.",

    "Her gün biraz daha özlüyorum, her gün biraz daha seviyorum.",

    "Uzaklık geçici, seninle olan sevgim sonsuz.",

    "Bir gün bu mesafeler bitecek ve sana sarılmak için kilometre saymayacağım.",

    "Yanımda olmadığın her an, sana ne kadar bağlı olduğumu hatırlatıyor.",

    "Seni göremediğim günlerde bile kalbimde hep yanımdasın.",

    "İki farklı şehir, tek bir kalp. Yağız & Sinem ❤️"

];

const distanceText =
    document.getElementById(
        "distanceText"
    );

let messageIndex = 0;

function changeMessage() {

    distanceText.style.opacity = "0";

    distanceText.style.transform =
        "translateY(8px)";

    setTimeout(
        () => {

            messageIndex =
                (messageIndex + 1)
                % distanceMessages.length;

            distanceText.textContent =
                distanceMessages[
                    messageIndex
                ];

            distanceText.style.opacity =
                "1";

            distanceText.style.transform =
                "translateY(0)";

        },
        550
    );

}

setInterval(
    changeMessage,
    5000
);


/* =====================================================
   HEART SYNCHRONIZATION
===================================================== */

const centerName =
    document.querySelector(
        ".center-name"
    );

const heartWrapper =
    document.querySelector(
        ".heart-wrapper"
    );

function syncVisualBeat() {

    centerName.style.transform =
        "translate(-50%, -50%) scale(1.07)";

    setTimeout(
        () => {

            centerName.style.transform =
                "translate(-50%, -50%) scale(1)";

        },
        115
    );

}

setInterval(
    syncVisualBeat,
    1150
);


/* =====================================================
   FIRST INTERACTION
===================================================== */

document.addEventListener(
    "click",
    () => {

        if (
            !musicPlaying &&
            startScreen.classList.contains("hidden")
        ) {

            startMusic();

        }

    },
    { once: true }
);

</script>
