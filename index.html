<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yağız & Sinem ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 50% 40%,rgba(255,70,190,.20),transparent 35%),
        linear-gradient(135deg,#160020,#48005f,#160022);
}

/* =========================
   ARKA PLAN YILDIZLARI
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    bottom:-20px;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 9px white;
    opacity:0;
    animation:rise linear infinite;
}

@keyframes rise{
    0%{
        transform:translateY(0) scale(.3);
        opacity:0;
    }

    15%{
        opacity:.9;
    }

    80%{
        opacity:.55;
    }

    100%{
        transform:translateY(-110vh) scale(1);
        opacity:0;
    }
}

/* =========================
   ÜST SOL
========================= */

.signature{
    position:fixed;
    top:20px;
    left:20px;
    z-index:30;

    display:flex;
    align-items:center;
    gap:8px;

    font-size:14px;
    letter-spacing:.5px;
}

.mini-heart{
    color:#ff79d5;
    font-size:23px;

    text-shadow:
        0 0 8px #ff45c5,
        0 0 18px #ff45c5;

    animation:miniBeat 1.15s infinite;
}

@keyframes miniBeat{
    0%,100%{
        transform:scale(1);
    }

    14%{
        transform:scale(1.25);
    }

    28%{
        transform:scale(1);
    }

    42%{
        transform:scale(1.16);
    }
}

/* =========================
   ANA KONTEYNER
========================= */

.container{
    position:relative;
    z-index:5;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* =========================
   KALP ALANI
========================= */

.heart-area{
    position:relative;

    width:min(94vw,560px);
    height:min(67vh,500px);

    display:flex;
    align-items:center;
    justify-content:center;
}

/* Yalnızca ışık efekti.
   Burada CSS kalp yok. */

.heart-glow{
    position:absolute;

    width:330px;
    height:330px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,200,.24),
            rgba(180,50,255,.10),
            transparent 70%
        );

    filter:blur(20px);

    animation:glowPulse 1.2s infinite;
}

@keyframes glowPulse{
    0%,100%{
        transform:scale(.92);
        opacity:.65;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

/* =========================
   YAZI KALBİ
========================= */

.text-heart{
    position:absolute;
    inset:0;
}

/* Kalbi oluşturan kelimeler */

.heart-word{
    position:absolute;

    transform:translate(-50%,-50%);

    white-space:nowrap;

    font-weight:700;

    color:#ffb5eb;

    text-shadow:
        0 0 5px #ff55c8,
        0 0 11px rgba(255,70,200,.75);

    user-select:none;

    animation:wordPulse 1.2s infinite ease-in-out;
}

@keyframes wordPulse{

    0%,100%{
        opacity:.72;

        transform:
            translate(-50%,-50%)
            scale(.94);
    }

    50%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.06);
    }
}

/* =========================
   MERKEZDEKİ SINEM
========================= */

.center-halo{
    position:absolute;

    left:50%;
    top:51%;

    width:200px;
    height:120px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.22),
            rgba(255,70,200,.16),
            transparent 72%
        );

    filter:blur(14px);

    z-index:40;

    animation:haloPulse 1.2s infinite;
}

@keyframes haloPulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.9);

        opacity:.65;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.18);

        opacity:1;
    }
}

.center-name{
    position:absolute;

    left:50%;
    top:51%;

    transform:translate(-50%,-50%);

    z-index:50;

    font-size:clamp(52px,14vw,86px);

    font-weight:900;

    letter-spacing:2px;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 12px white,
        0 0 25px #ff68d1,
        0 0 45px #ff35bd,
        0 0 75px rgba(255,40,190,.9);

    animation:centerBeat 1.2s infinite ease-in-out;

    pointer-events:none;
}

@keyframes centerBeat{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    14%{
        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

    28%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    42%{
        transform:
            translate(-50%,-50%)
            scale(1.07);
    }
}

/* =========================
   MESAJ KUTUSU
========================= */

.message-box{
    width:min(88vw,510px);

    min-height:92px;

    padding:18px 22px;

    margin-top:-4px;

    border:
        1px solid
        rgba(255,255,255,.22);

    border-radius:20px;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:
        0 0 28px rgba(255,60,190,.16),
        inset 0 0 20px rgba(255,255,255,.03);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:15px;
    line-height:1.6;

    color:#ffeafb;
}

.message{
    animation:messageFade 1s ease;
}

@keyframes messageFade{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   ALT YAZI
========================= */

.special{
    margin-top:15px;

    font-size:14px;

    color:white;

    letter-spacing:2px;

    text-shadow:
        0 0 8px white,
        0 0 18px #ff4cc7;
}

/* =========================
   ECG
========================= */

.ecg{
    position:absolute;

    left:0;
    bottom:18px;

    width:100%;
    height:45px;

    overflow:hidden;

    opacity:.65;
}

.ecg svg{
    width:100%;
    height:100%;
}

.ecg path{
    fill:none;

    stroke:#ff8add;

    stroke-width:2;

    filter:
        drop-shadow(0 0 5px #ff35c4);

    stroke-dasharray:1000;
    stroke-dashoffset:1000;

    animation:
        ecgMove 2.2s linear infinite;
}

@keyframes ecgMove{
    to{
        stroke-dashoffset:0;
    }
}

/* =========================
   BAŞLANGIÇ EKRANI
========================= */

.start-screen{
    position:fixed;

    inset:0;

    z-index:100;

    background:
        radial-gradient(
            circle,
            #500060,
            #16001f 70%
        );

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.start-screen h1{
    font-size:38px;

    margin-bottom:10px;

    text-shadow:
        0 0 10px #ff55cc,
        0 0 25px #ff55cc;
}

.start-screen p{
    opacity:.8;

    margin-bottom:25px;
}

.start-btn{
    border:none;

    padding:14px 30px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #ff48c4,
            #a84dff
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    box-shadow:
        0 0 25px rgba(255,60,200,.5);
}

/* =========================
   TELEFON
========================= */

@media(max-width:600px){

    .heart-area{
        width:96vw;
        height:390px;
    }

    .heart-word{
        font-size:10px;
    }

    .center-name{
        font-size:58px;
    }

    .center-halo{
        width:175px;
        height:105px;
    }

    .message-box{
        width:89vw;

        min-height:95px;

        font-size:14px;

        padding:
            17px
            19px;
    }

    .special{
        font-size:13px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ARKA PLAN
========================= -->

<div class="background" id="background"></div>


<!-- =========================
     YAĞIZ & SİNEM
========================= -->

<div class="signature">

    <span class="mini-heart">♥</span>

    <span>Yağız & Sinem</span>

</div>


<!-- =========================
     BAŞLANGIÇ
========================= -->

<div class="start-screen" id="startScreen">

    <h1>
        Yağız ❤️ Sinem
    </h1>

    <p>
        Sadece ikimize özel...
    </p>

    <button
        class="start-btn"
        onclick="startSite()"
    >
        Başlat ❤️
    </button>

</div>


<!-- =========================
     ANA İÇERİK
========================= -->

<div class="container">

    <div class="heart-area">

        <!-- Kalp ışığı -->

        <div class="heart-glow"></div>


        <!-- Yazılardan oluşan kalp -->

        <div
            class="text-heart"
            id="textHeart"
        ></div>


        <!-- Sinem için ayrı merkez -->

        <div class="center-halo"></div>

        <div class="center-name">
            Sinem
        </div>

    </div>


    <!-- =========================
         MESAJ
    ========================= -->

    <div class="message-box">

        <div
            class="message"
            id="message"
        ></div>

    </div>


    <!-- =========================
         ÖZEL YAZI
    ========================= -->

    <div class="special">
        Sadece Sinem'ime özel
    </div>

</div>


<!-- =========================
     ECG
========================= -->

<div class="ecg">

<svg
    viewBox="0 0 1000 100"
    preserveAspectRatio="none"
>

    <path
        d="
        M0 50
        L100 50
        L130 50
        L145 30
        L160 75
        L175 10
        L190 50
        L300 50
        L400 50
        L430 50
        L445 30
        L460 75
        L475 10
        L490 50
        L600 50
        L700 50
        L730 50
        L745 30
        L760 75
        L775 10
        L790 50
        L1000 50
        "
    />

</svg>

</div>


<!-- =========================
     MÜZİK
========================= -->

<audio
    id="music"
    loop
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

/* ==================================================
   YILDIZLAR
================================================== */

const background =
    document.getElementById("background");

for(let i = 0; i < 50; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    star.style.animationDelay =
        Math.random() * 8 + "s";

    const size =
        1 + Math.random() * 3;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    background.appendChild(star);
}


/* ==================================================
   YAZILARDAN DOLU KALP
================================================== */

const heart =
    document.getElementById("textHeart");

const words = [

    "Yağız",
    "Sinem",
    "Aşkım",
    "I Love You"

];


/*
   Kalp denklemi:

   (x²+y²-1)³ - x²y³ <= 0

   Bu denklem sayesinde
   CSS kalp şekli kullanmadan
   gerçek bir dolu kalp alanı
   oluşturuyoruz.
*/

const points = [];


for(
    let y = -1.15;
    y <= 1.15;
    y += 0.075
){

    for(
        let x = -1.35;
        x <= 1.35;
        x += 0.075
    ){

        const equation =
            Math.pow(
                x*x + y*y - 1,
                3
            )
            -
            x*x *
            Math.pow(y,3);


        if(equation <= 0){

            /*
              Merkezde Sinem için
              boş alan bırak.
            */

            const centerDistance =
                Math.sqrt(
                    Math.pow(x / 0.55,2) +
                    Math.pow(y / 0.38,2)
                );


            if(centerDistance < 1){
                continue;
            }


            points.push({
                x:x,
                y:y
            });

        }

    }

}


/* Noktaları karıştır */

points.sort(
    () => Math.random() - .5
);


/* ==================================================
   KALBİ KELİMELERLE DOLDUR
================================================== */

points.forEach(
    (point,index) => {

        const word =
            document.createElement("span");


        word.className =
            "heart-word";


        word.textContent =
            words[index % words.length];


        /*
           Kalp koordinatlarını
           ekrana çevir.
        */

        const px =
            50 +
            (point.x / 1.35) * 45;


        const py =
            49 -
            (point.y / 1.15) * 43;


        word.style.left =
            px + "%";


        word.style.top =
            py + "%";


        /*
           Küçük boyut farkları
           daha doğal görünmesini sağlar.
        */

        const size =
            8 +
            Math.random() * 4;


        word.style.fontSize =
            size + "px";


        /*
           Her kelimenin animasyonu
           farklı anda başlasın.
        */

        word.style.animationDelay =
            Math.random() * 1.2 + "s";


        heart.appendChild(word);

    }
);


/* ==================================================
   MESAJLAR
================================================== */

const messages = [

    "Mesafeler ne kadar uzak olursa olsun, kalbimdeki yerin hep aynı. ❤️",

    "Sen benim en güzel tesadüfüm değil, en güzel gerçeğimsin.",

    "Yanında olamadığım her an seni biraz daha özlüyorum.",

    "Aramızda kilometreler olabilir ama kalbimiz aynı yerde.",

    "Bir gün bu mesafelerin hepsi bitecek ve sana sarılacağım.",

    "İyi ki hayatımdasın Sinem. Seni çok seviyorum. ❤️",

    "Sen benim evim gibisin. Nerede olursam olayım, aklım hep sende.",

    "Her gece uyumadan önce aklımdan geçen son kişi sensin.",

    "Yağız & Sinem... Mesafeye rağmen aynı hikâyenin iki kişisi."

];


let messageIndex = 0;


const messageElement =
    document.getElementById("message");


function changeMessage(){

    messageElement.style.animation =
        "none";


    /*
       Animasyonu yeniden başlat.
    */

    void messageElement.offsetWidth;


    messageElement.textContent =
        messages[messageIndex];


    messageElement.style.animation =
        "messageFade 1s ease";


    messageIndex++;


    if(
        messageIndex >= messages.length
    ){

        messageIndex = 0;

    }

}


changeMessage();


setInterval(
    changeMessage,
    5000
);


/* ==================================================
   BAŞLAT BUTONU
================================================== */

function startSite(){

    const screen =
        document.getElementById(
            "startScreen"
        );


    screen.style.transition =
        "opacity .8s ease";


    screen.style.opacity =
        "0";


    setTimeout(
        () => {

            screen.style.display =
                "none";

        },
        800
    );


    const music =
        document.getElementById(
            "music"
        );


    /*
       Kullanıcı butona bastığı için
       telefon tarayıcısı müziğe izin verir.
    */

    music.play().catch(
        () => {}
    );

}

</script>

</body>
</html>
